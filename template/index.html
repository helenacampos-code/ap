<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Enviar JSON para FastAPI</title>
</head>
<body>
    <h2>Cadastro de Produto</h2>
    <form id="especificação_itens">

        <input type="text" id="nome" placeholder="insira especificação"required><br><br>
        <input type="text" id="descritivo" placeholder="insira descrição"required><br><br>

        <button type="submit">Enviar</button>
    </form>

    <script>

                item:parseFloat(document.getElementById('item').value),
                descritivo: document.getElementById('descritivo').value,
                unid_de_medida: document.getElementById('unid_de_medida').value,
                nome: document.getElementById('nome').value,
                quant_total:parseFloat(document.getElementById('quant_total').value)
                
            };

            const resposta = await fetch('http://127.0.0', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },

            });

            alert(resultado.mensagem);
        });
    </script>
</body>
</html>
